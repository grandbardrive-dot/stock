<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#111">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Agenda — Grandbar Stock</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Barlow+Condensed:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap">
  <link rel="stylesheet" href="style.css">
  <style>
    body { background: #0f0f0f; color: #e8e0d0; }

    /* ── HEADER ── */
    .ag-header {
      position: sticky; top: 0; z-index: 100;
      background: #151515;
      border-bottom: 2px solid #c9a84c;
      padding-top: env(safe-area-inset-top, 0);
    }
    .ag-topbar {
      display: flex; align-items: center; gap: 10px;
      padding: 14px 16px 10px;
    }
    .back-btn {
      background: none; border: none; color: #c9a84c;
      font-size: 28px; line-height: 1; cursor: pointer; padding: 0 4px 0 0;
    }
    .ag-topbar h1 {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 22px; font-weight: 800; text-transform: uppercase;
      letter-spacing: 1px; color: #fff; margin: 0;
    }

    /* ── TABS ── */
    .ag-tabs {
      display: flex; gap: 0;
      border-top: 1px solid #222;
    }
    .ag-tab {
      flex: 1; background: none; border: none; border-bottom: 3px solid transparent;
      padding: 10px 8px;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 14px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .6px; color: #555; cursor: pointer;
      transition: color .15s, border-color .15s;
    }
    .ag-tab.active { color: #c9a84c; border-bottom-color: #c9a84c; }
    .ag-tab-user { font-size: 10px; font-weight: 400; color: #444; display: block; margin-top: 1px; }
    .ag-tab.active .ag-tab-user { color: #8a7040; }

    /* ── CONFIG ROW ── */
    .ag-config {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 16px 10px;
      border-top: 1px solid #1e1e1e;
      flex-wrap: wrap;
    }
    .ag-config-label { font-size: 12px; color: #666; white-space: nowrap; }

    /* Target selector */
    .target-seg {
      display: flex; border: 1px solid #2a2a2a; border-radius: 6px; overflow: hidden;
    }
    .target-seg button {
      background: #1a1a1a; border: none; color: #888;
      padding: 5px 10px; font-size: 12px; cursor: pointer;
      font-family: 'Barlow Condensed', sans-serif; font-weight: 700;
      transition: background .15s, color .15s;
    }
    .target-seg button.active { background: #c9a84c; color: #111; }
    .target-seg button + button { border-left: 1px solid #2a2a2a; }

    .reset-btn {
      margin-left: auto;
      background: none; border: 1px solid #2a1a1a; color: #6a4040;
      padding: 5px 10px; font-size: 11px; border-radius: 6px;
      cursor: pointer; font-family: 'Barlow Condensed', sans-serif; font-weight: 700;
      text-transform: uppercase; letter-spacing: .5px;
    }
    .reset-btn:hover { border-color: #c04040; color: #c04040; }

    /* ── STATS ── */
    .ag-stats {
      display: flex; background: #111; border-bottom: 1px solid #1e1e1e;
    }
    .ag-stat {
      flex: 1; text-align: center; padding: 9px 4px;
      border-right: 1px solid #1e1e1e;
    }
    .ag-stat:last-child { border-right: none; }
    .ag-stat-num {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 20px; font-weight: 800; color: #c9a84c; line-height: 1;
    }
    .ag-stat-lbl { font-size: 9px; color: #555; text-transform: uppercase; margin-top: 2px; }

    /* ── BODY ── */
    .ag-body { padding: 10px 12px 90px; }

    .sec-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 12px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 1px; color: #c9a84c;
      margin: 16px 0 7px 2px;
      display: flex; align-items: center; gap: 8px;
    }
    .sec-title::after { content:''; flex:1; height:1px; background:#1e1e1e; }

    /* ── SESSION CARD ── */
    .s-card {
      background: #191919;
      border: 1px solid #242424;
      border-radius: 10px;
      margin-bottom: 8px;
      overflow: hidden;
      transition: border-color .15s;
    }
    .s-card.is-next  { border-color: #c9a84c; }
    .s-card.is-done  { opacity: .45; }
    .s-card.is-overdue { border-color: #904030; }

    .s-header {
      display: flex; align-items: center; gap: 10px;
      padding: 11px 14px; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .s-num {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 26px; font-weight: 800;
      color: #2e2e2e; min-width: 32px; text-align: center; line-height: 1;
    }
    .s-card.is-next  .s-num { color: #c9a84c; }
    .s-card.is-done  .s-num { color: #252525; }

    .s-info { flex: 1; }
    .s-date {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 16px; font-weight: 700; color: #ccc; letter-spacing: .2px;
    }
    .s-card.is-next .s-date { color: #fff; }
    .s-meta { font-size: 10px; color: #555; margin-top: 2px; }

    .s-badge {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 10px; font-weight: 700; text-transform: uppercase;
      padding: 3px 7px; border-radius: 20px; letter-spacing: .5px; white-space: nowrap;
    }
    .badge-next    { background:#c9a84c1a; color:#c9a84c; border:1px solid #c9a84c44; }
    .badge-done    { background:#1a2a1a; color:#4a8a4a; border:1px solid #253525; }
    .badge-overdue { background:#2a1818; color:#904030; border:1px solid #3a2020; }

    .s-chevron { color: #333; font-size: 16px; transition: transform .2s; }
    .s-card.is-open .s-chevron { transform: rotate(180deg); }

    /* ── SESSION BODY ── */
    .s-body { display: none; border-top: 1px solid #1e1e1e; padding: 10px 14px 14px; }
    .s-card.is-open .s-body { display: block; }

    .prov-row {
      display: flex; align-items: center; gap: 8px;
      padding: 7px 0; border-bottom: 1px solid #1c1c1c;
    }
    .prov-row:last-child { border-bottom: none; }
    .prov-dot { width: 6px; height: 6px; border-radius: 50%; background: #2e2e2e; flex-shrink:0; }
    .prov-name {
      flex: 1;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 14px; font-weight: 600; color: #bbb;
      text-transform: uppercase; letter-spacing: .2px;
    }
    .prov-count { font-size: 10px; color: #555; white-space: nowrap; }

    .s-action { padding: 10px 0 0; }
    .mark-btn {
      width: 100%; background: none; border: 1px solid #253525; color: #4a8a4a;
      padding: 9px; border-radius: 8px;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 13px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .5px; cursor: pointer;
      transition: background .15s, border-color .15s;
    }
    .mark-btn:hover { background: #1a2a1a; }
    .mark-btn.undo { border-color: #252535; color: #555577; }

    /* ── FOOTER ── */
    .ag-footer {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: #151515;
      border-top: 1px solid #c9a84c33;
      padding: 8px 16px calc(8px + env(safe-area-inset-bottom, 0));
      z-index: 50;
    }
    .ag-footer-row { display:flex; justify-content:space-between; font-size:11px; color:#555; margin-bottom:5px; }
    .ag-footer-bar { height: 3px; background: #1e1e1e; border-radius: 2px; overflow:hidden; }
    .ag-footer-fill { height:100%; background:#c9a84c; border-radius:2px; transition: width .4s ease; }
  </style>
</head>
<body>

<header class="ag-header">
  <div class="ag-topbar">
    <button class="back-btn" onclick="history.back()">‹</button>
    <h1>Agenda de Stock</h1>
  </div>

  <!-- Tabs -->
  <div class="ag-tabs">
    <button class="ag-tab active" id="tab-vinos" onclick="switchTab('vinos')">
      🍷 Vinos
      <span class="ag-tab-user">Lucas Porro</span>
    </button>
    <button class="ag-tab" id="tab-spirits" onclick="switchTab('spirits')">
      🥃 Spirits & Gaseosas
      <span class="ag-tab-user">Lucas Buenanueva</span>
    </button>
  </div>

  <!-- Config -->
  <div class="ag-config">
    <span class="ag-config-label">Meta:</span>
    <div class="target-seg" id="target-seg">
      <button onclick="setTarget(1)">1 mes</button>
      <button onclick="setTarget(2)" class="active">2 meses</button>
      <button onclick="setTarget(3)">3 meses</button>
    </div>
    <span class="ag-config-label" id="per-label" style="color:#666;margin-left:4px"></span>
    <button class="reset-btn" onclick="confirmReset()">↺ Reiniciar</button>
  </div>

  <!-- Stats -->
  <div class="ag-stats" id="ag-stats">
    <div class="ag-stat"><div class="ag-stat-num" id="s-provs">—</div><div class="ag-stat-lbl">Proveedores</div></div>
    <div class="ag-stat"><div class="ag-stat-num" id="s-lunEst">—</div><div class="ag-stat-lbl">Lunes</div></div>
    <div class="ag-stat"><div class="ag-stat-num" id="s-pps">—</div><div class="ag-stat-lbl">Por sesión</div></div>
    <div class="ag-stat"><div class="ag-stat-num" id="s-done">0</div><div class="ag-stat-lbl">Hechas</div></div>
  </div>
</header>

<main class="ag-body" id="ag-body"></main>

<div class="ag-footer">
  <div class="ag-footer-row">
    <span id="footer-txt">—</span>
    <span id="footer-pct">0%</span>
  </div>
  <div class="ag-footer-bar"><div class="ag-footer-fill" id="footer-fill" style="width:0%"></div></div>
</div>

<script src="productos.js"></script>
<script>
// ── INACTIVAS VINOS ────────────────────────────────────────────
const INACTIVAS_VINOS = new Set([
  'BODEGA ACHAVAL FERRER','BODEGA ALTOS LAS HORMIGAS','BODEGA AMALAYA',
  'BODEGA BARBERIS','BODEGA BIANCHI','BODEGA CAVAS ROSELL BOHER',
  'BODEGA CHAKANA','BODEGA CHAMAN','BODEGA CLOS DE LOS SIETE',
  'BODEGA CORRAL DE PALOS','BODEGA CRUZAT','BODEGA CUVELIER DE LOS ANDES',
  'BODEGA DIAMANDES','BODEGA DIAMANTES','BODEGA DOMAINE BOUSQUET',
  'BODEGA DURIGUTTI','BODEGA EDUARDO VIDAL WINES','BODEGA EL EQUILIBRISTA WINES',
  'BODEGA EL RELATOR','BODEGA ESCALA HUMANA','BODEGA ESMERALDA',
  'BODEGA FINCA AGOSTINO','BODEGA FINCA BANDINI','BODEGA FINCA FLICHMAN',
  'BODEGA FUEGO BLANCO','BODEGA LA IGNACIA','BODEGA LAMADRID',
  'BODEGA LOS COROS','BODEGA LOS VALIENTES','BODEGA MARRASO',
  'BODEGA MAURICIO LORCA','BODEGA MENDEL','BODEGA MONTEVIEJO',
  'BODEGA MOSQUITA MUERTA','BODEGA MOULIN BLUE','BODEGA NORTON',
  'BODEGA REVANCHA','BODEGA ROLLAND WINE','BODEGA SERGIO CASE',
  'BODEGA SIETE LEGUAS','BODEGA TINTO NEGRO','BODEGA TRES 14',
  'BODEGA TUPUN','BODEGA VIÑA LOS CHOCOS','BODEGA ZORZAL',
]);

// ── CONFIG ────────────────────────────────────────────────────
const LS_DONE_V  = 'grandbar_agenda_vinos_done';
const LS_DONE_S  = 'grandbar_agenda_spirits_done';
const LS_TARGET  = 'grandbar_agenda_target';
const LS_TAB     = 'grandbar_agenda_tab';
const WEEKS_PER_MONTH = 4.33;

let currentTab   = localStorage.getItem(LS_TAB) || 'vinos';
let targetMonths = parseInt(localStorage.getItem(LS_TARGET) || '2', 10);
let doneVinos    = new Set(JSON.parse(localStorage.getItem(LS_DONE_V) || '[]'));
let doneSpirits  = new Set(JSON.parse(localStorage.getItem(LS_DONE_S) || '[]'));

// ── EXTRACCIÓN DE PROVEEDORES ─────────────────────────────────
function getProveedores(productos, inactivas) {
  const map = {};
  (productos || []).forEach(p => {
    const prov = (p.proveedor || '').trim();
    if (!prov || inactivas.has(prov)) return;
    map[prov] = (map[prov] || 0) + 1;
  });
  return Object.entries(map)
    .map(([name, count]) => ({ name, count }))
    .sort((a, b) => b.count - a.count);
}

// ── DISTRIBUCIÓN BALANCEADA ───────────────────────────────────
// Greedy: menor carga total primero
function distribute(provs, perSession) {
  const n = Math.ceil(provs.length / perSession);
  const buckets = Array.from({ length: n }, () => ({ provs: [], total: 0 }));

  provs.forEach(p => {
    let best = 0;
    buckets.forEach((b, i) => {
      if (b.provs.length < perSession &&
          (buckets[best].provs.length >= perSession || b.total < buckets[best].total)) {
        best = i;
      }
    });
    buckets[best].provs.push(p);
    buckets[best].total += p.count;
  });
  return buckets;
}

// ── FECHAS ───────────────────────────────────────────────────
function nextMonday(from = new Date()) {
  const d = new Date(from); d.setHours(0,0,0,0);
  const dow = d.getDay();
  d.setDate(d.getDate() + (dow === 1 ? 0 : (8 - dow) % 7 || 7));
  return d;
}
function addWeeks(d, n) { const r = new Date(d); r.setDate(r.getDate() + n * 7); return r; }
function dateKey(d) { return d.toISOString().slice(0, 10); }
function fmtDate(d) {
  const DS = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
  const MS = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  return `${DS[d.getDay()]} ${d.getDate()} ${MS[d.getMonth()]} ${d.getFullYear()}`;
}

// ── CALCULAR PER-SESSION PARA EL TARGET ──────────────────────
function calcPerSession(total, months) {
  const targetSessions = Math.round(months * WEEKS_PER_MONTH);
  return Math.max(1, Math.ceil(total / targetSessions));
}

// ── BUILD & RENDER ────────────────────────────────────────────
function build() {
  const isVinos    = currentTab === 'vinos';
  const productos  = isVinos
    ? (typeof PRODUCTOS_VINOS   !== 'undefined' ? PRODUCTOS_VINOS   : [])
    : (typeof PRODUCTOS_SPIRITS !== 'undefined' ? PRODUCTOS_SPIRITS : []);
  const inactivas  = isVinos ? INACTIVAS_VINOS : new Set();
  const doneSet    = isVinos ? doneVinos : doneSpirits;

  const provs = getProveedores(productos, inactivas);
  const perSession = calcPerSession(provs.length, targetMonths);
  const sessions   = distribute(provs, perSession);
  const nLunes     = sessions.length;
  const meses      = (nLunes / WEEKS_PER_MONTH).toFixed(1);

  // stats
  document.getElementById('s-provs').textContent  = provs.length;
  document.getElementById('s-lunEst').textContent = nLunes;
  document.getElementById('s-pps').textContent    = perSession;
  const doneCount = sessions.filter((_, i) => doneSet.has(dateKey(addWeeks(nextMonday(), i)))).length;
  document.getElementById('s-done').textContent   = doneCount;
  document.getElementById('per-label').textContent = `≈ ${meses} meses · ${perSession} por lunes`;

  // update target buttons
  document.querySelectorAll('.target-seg button').forEach(b => {
    b.classList.toggle('active', parseInt(b.textContent) === targetMonths);
  });

  // footer progress
  const pct = nLunes ? Math.round((doneCount / nLunes) * 100) : 0;
  document.getElementById('footer-pct').textContent = pct + '%';
  document.getElementById('footer-fill').style.width = pct + '%';
  document.getElementById('footer-txt').textContent =
    doneCount === nLunes
      ? '¡Ciclo completo! Reiniciá para empezar de nuevo.'
      : doneCount === 0
      ? `${nLunes} sesiones · ${provs.length} proveedores`
      : `${doneCount} hechas · ${nLunes - doneCount} restantes`;

  // render cards
  const today = new Date(); today.setHours(0,0,0,0);
  const first  = nextMonday();
  const schedule = sessions.map((s, i) => ({
    date: addWeeks(first, i),
    provs: s.provs,
    total: s.total,
  }));

  const nextSess = schedule.find(s => !doneSet.has(dateKey(s.date)) && s.date >= today);
  const nextKey  = nextSess ? dateKey(nextSess.date) : null;

  const body = document.getElementById('ag-body');
  body.innerHTML = '';

  const pending = schedule.filter(s => !doneSet.has(dateKey(s.date)));
  const done    = schedule.filter(s =>  doneSet.has(dateKey(s.date)));

  if (pending.length) {
    body.appendChild(secTitle('Próximas sesiones'));
    pending.forEach((s, i) => body.appendChild(
      makeCard(s, i + 1, doneSet, today, nextKey, isVinos)
    ));
  }
  if (done.length) {
    body.appendChild(secTitle('Completadas'));
    done.forEach((s, i) => body.appendChild(
      makeCard(s, schedule.indexOf(s) + 1, doneSet, today, nextKey, isVinos)
    ));
  }
}

function secTitle(text) {
  const d = document.createElement('div');
  d.className = 'sec-title'; d.textContent = text; return d;
}

function makeCard(session, idx, doneSet, today, nextKey, isVinos) {
  const key    = dateKey(session.date);
  const isDone = doneSet.has(key);
  const isNext = key === nextKey;
  const isOvrd = !isDone && session.date < today;
  const isOpen = isNext;

  const card = document.createElement('div');
  card.className = 's-card' +
    (isDone ? ' is-done' : '') +
    (isNext ? ' is-next' : '') +
    (isOvrd ? ' is-overdue' : '') +
    (isOpen ? ' is-open' : '');
  card.id = 'card-' + key;

  let badge = '';
  if (isNext)    badge = '<span class="s-badge badge-next">Próxima</span>';
  else if (isDone)    badge = '<span class="s-badge badge-done">✓ Hecha</span>';
  else if (isOvrd)    badge = '<span class="s-badge badge-overdue">Vencida</span>';

  const provRows = session.provs.map(p =>
    `<div class="prov-row">
      <div class="prov-dot"></div>
      <div class="prov-name">${p.name}</div>
      <div class="prov-count">${p.count} ítem${p.count !== 1 ? 's' : ''}</div>
    </div>`
  ).join('');

  const actionBtn = isDone
    ? `<button class="mark-btn undo" onclick="toggleDone('${key}', false, ${isVinos})">↩ Marcar como pendiente</button>`
    : `<button class="mark-btn"      onclick="toggleDone('${key}', true, ${isVinos})">✓ Marcar como realizada</button>`;

  card.innerHTML = `
    <div class="s-header" onclick="toggleCard('${key}')">
      <div class="s-num">${String(idx).padStart(2,'0')}</div>
      <div class="s-info">
        <div class="s-date">${fmtDate(session.date)}</div>
        <div class="s-meta">${session.provs.length} proveedores · ${session.total} ítems est.</div>
      </div>
      ${badge}
      <div class="s-chevron">⌄</div>
    </div>
    <div class="s-body">
      ${provRows}
      <div class="s-action">${actionBtn}</div>
    </div>
  `;
  return card;
}

function toggleCard(key) {
  document.getElementById('card-' + key)?.classList.toggle('is-open');
}

function toggleDone(key, done, isVinos) {
  const set = isVinos ? doneVinos : doneSpirits;
  const lsKey = isVinos ? LS_DONE_V : LS_DONE_S;
  if (done) set.add(key); else set.delete(key);
  localStorage.setItem(lsKey, JSON.stringify([...set]));
  build();
}

function switchTab(tab) {
  currentTab = tab;
  localStorage.setItem(LS_TAB, tab);
  document.getElementById('tab-vinos').classList.toggle('active', tab === 'vinos');
  document.getElementById('tab-spirits').classList.toggle('active', tab === 'spirits');
  build();
}

function setTarget(months) {
  targetMonths = months;
  localStorage.setItem(LS_TARGET, String(months));
  build();
}

function confirmReset() {
  const label = currentTab === 'vinos' ? 'Vinos (Lucas Porro)' : 'Spirits (Lucas Buenanueva)';
  if (confirm(`¿Reiniciar el progreso de ${label}?`)) {
    if (currentTab === 'vinos') { doneVinos.clear(); localStorage.removeItem(LS_DONE_V); }
    else { doneSpirits.clear(); localStorage.removeItem(LS_DONE_S); }
    build();
  }
}

// ── INIT ─────────────────────────────────────────────────────
switchTab(currentTab);
</script>
</body>
</html>
