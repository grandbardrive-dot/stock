<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1F447F">
  <title>Rutas — Grandbar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Barlow+Condensed:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="page-header">
  <div class="header-top">
    <button class="back-btn" onclick="location.href='index.html'" aria-label="Volver">‹</button>
    <div class="header-title">
      <div class="header-sector">Rutas</div>
      <div class="header-user">Grandbar Depósito</div>
    </div>
  </div>
</header>

<main style="display:flex;flex-direction:column;align-items:center;justify-content:center;
             min-height:calc(100dvh - 61px);padding:2rem 1.5rem;text-align:center;gap:1.5rem">

  <div style="font-size:4rem;line-height:1">🚚</div>

  <div>
    <div style="font-family:'Libre Baskerville',serif;font-size:1.4rem;font-weight:700;
                color:var(--cream);margin-bottom:0.4rem">Sistema de Rutas</div>
    <div style="font-size:0.85rem;color:var(--muted);letter-spacing:0.06em;
                text-transform:uppercase">Próximamente</div>
  </div>

  <div style="background:var(--surface);border:1px solid var(--border);border-radius:8px;
              padding:1rem 1.5rem;max-width:320px;font-size:0.82rem;color:var(--muted);
              line-height:1.6">
    Esta sección va a permitir gestionar las rutas de entrega y el seguimiento
    de pedidos del depósito.
  </div>

  <a href="index.html"
     style="margin-top:0.5rem;background:var(--gold);color:var(--blue-dark);
            border:none;border-radius:6px;font-family:var(--font);font-size:0.9rem;
            font-weight:800;letter-spacing:0.08em;text-transform:uppercase;
            padding:0.85rem 2rem;text-decoration:none;display:inline-block">
    ← Volver al inicio
  </a>

</main>

</body>
</html>
