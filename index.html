<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>Grandbar — Control de Stock</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Barlow+Condensed:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ══ PANTALLA 1: Selección de usuario ══ -->
<div id="screen-usuario" class="screen">
  <div class="login-wrap">

    <div class="login-logo">
      <img src="logo.png" alt="GrandBar" width="220" height="auto">
      <span class="logo-tag">Control de Stock</span>
    </div>

    <span class="date-chip" id="date-label">—</span>

    <span class="divider-label">Seleccioná tu usuario</span>

    <div class="user-cards">

      <div class="user-card" data-sector="vinos" data-usuario="Lucas Porro" role="button" tabindex="0">
        <div class="avatar avatar-wine">LP</div>
        <div class="info">
          <div class="name">Lucas Porro</div>
          <div class="sector">Vinos</div>
        </div>
        <span class="arrow">›</span>
      </div>

      <div class="user-card" data-sector="spirits" data-usuario="Lucas Buenanueva" role="button" tabindex="0">
        <div class="avatar avatar-spirit">LB</div>
        <div class="info">
          <div class="name">Lucas Buenanueva</div>
          <div class="sector">Spirits &amp; Gaseosas</div>
        </div>
        <span class="arrow">›</span>
      </div>

    </div>
  </div>
</div>

<!-- ══ PANTALLA 2: Selección de proveedores ══ -->
<div id="screen-proveedor" class="screen hidden">

  <!-- Header azul fijo -->
  <header class="prov-topbar">
    <button class="prov-back-btn" id="prov-back" aria-label="Volver">‹</button>
    <div class="prov-topbar-info">
      <div class="prov-sector-label" id="prov-sector-label">Vinos</div>
      <div class="prov-user-label" id="prov-user-label">Lucas Porro</div>
    </div>
  </header>

  <!-- Título + controles pegajosos -->
  <div class="prov-subheader">
    <p class="prov-pregunta">¿Qué stock vas a realizar hoy?</p>
    <div class="prov-btn-bar">
      <button class="prov-btn" id="btn-sel-todos">Seleccionar todos</button>
      <button class="prov-btn" id="btn-limpiar">Limpiar selección</button>
    </div>
    <div class="prov-sel-count" id="prov-sel-count">Ningún proveedor seleccionado</div>
  </div>

  <!-- Lista de proveedores (se genera dinámicamente) -->
  <div id="prov-list" class="prov-list" role="list"></div>

  <!-- Botón comenzar fijo abajo -->
  <div class="prov-footer">
    <button class="btn-comenzar" id="btn-comenzar" disabled>Comenzar conteo</button>
  </div>

</div>

<script src="productos.js"></script>
<script src="app.js"></script>
<script>
(function () {
  // ── Estado ──────────────────────────────────────────────────
  let sectorActual  = null;   // 'vinos' | 'spirits'
  let usuarioActual = null;
  let seleccionados = new Set();

  const screenUsuario   = document.getElementById('screen-usuario');
  const screenProveedor = document.getElementById('screen-proveedor');
  const provSectorLabel = document.getElementById('prov-sector-label');
  const provUserLabel   = document.getElementById('prov-user-label');
  const provList        = document.getElementById('prov-list');
  const selCount        = document.getElementById('prov-sel-count');
  const btnComenzar     = document.getElementById('btn-comenzar');
  const btnSelTodos     = document.getElementById('btn-sel-todos');
  const btnLimpiar      = document.getElementById('btn-limpiar');
  const btnBack         = document.getElementById('prov-back');

  renderDate('date-label');

  // ── Util: obtener proveedores únicos de un sector ────────────
  function getProveedores(sector) {
    const arr = sector === 'vinos' ? PRODUCTOS_VINOS : PRODUCTOS_SPIRITS;
    const counts = {};
    arr.forEach(p => { counts[p.proveedor] = (counts[p.proveedor] || 0) + 1; });
    return Object.entries(counts)
      .sort((a, b) => a[0].localeCompare(b[0], 'es'))
      .map(([nombre, cant]) => ({ nombre, cant }));
  }

  // ── Render lista de proveedores ──────────────────────────────
  function renderProveedores(proveedores) {
    provList.innerHTML = '';
    const frag = document.createDocumentFragment();

    proveedores.forEach(({ nombre, cant }) => {
      const item = document.createElement('div');
      item.className = 'prov-item' + (seleccionados.has(nombre) ? ' selected' : '');
      item.dataset.nombre = nombre;
      item.setAttribute('role', 'checkbox');
      item.setAttribute('aria-checked', seleccionados.has(nombre) ? 'true' : 'false');
      item.tabIndex = 0;

      item.innerHTML = `
        <div class="prov-checkbox"></div>
        <div class="prov-nombre">${nombre}</div>
        <div class="prov-cant">${cant} SKU${cant !== 1 ? 's' : ''}</div>`;

      item.addEventListener('click', () => toggleProveedor(nombre, item));
      item.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleProveedor(nombre, item); }
      });

      frag.appendChild(item);
    });

    provList.appendChild(frag);
    actualizarContador();
  }

  // ── Toggle selección ─────────────────────────────────────────
  function toggleProveedor(nombre, itemEl) {
    if (seleccionados.has(nombre)) {
      seleccionados.delete(nombre);
      itemEl.classList.remove('selected');
      itemEl.setAttribute('aria-checked', 'false');
    } else {
      seleccionados.add(nombre);
      itemEl.classList.add('selected');
      itemEl.setAttribute('aria-checked', 'true');
    }
    actualizarContador();
  }

  function actualizarContador() {
    const n = seleccionados.size;
    if (n === 0) {
      selCount.innerHTML = 'Ningún proveedor seleccionado';
      btnComenzar.disabled = true;
      btnComenzar.textContent = 'Comenzar conteo';
    } else {
      selCount.innerHTML = `<strong>${n}</strong> proveedor${n !== 1 ? 'es' : ''} seleccionado${n !== 1 ? 's' : ''}`;
      btnComenzar.disabled = false;
      btnComenzar.textContent = `Comenzar conteo (${n} proveedor${n !== 1 ? 'es' : ''})`;
    }
  }

  // ── Seleccionar todos / limpiar ──────────────────────────────
  btnSelTodos.addEventListener('click', () => {
    provList.querySelectorAll('.prov-item').forEach(item => {
      seleccionados.add(item.dataset.nombre);
      item.classList.add('selected');
      item.setAttribute('aria-checked', 'true');
    });
    actualizarContador();
  });

  btnLimpiar.addEventListener('click', () => {
    seleccionados.clear();
    provList.querySelectorAll('.prov-item').forEach(item => {
      item.classList.remove('selected');
      item.setAttribute('aria-checked', 'false');
    });
    actualizarContador();
  });

  // ── Volver a pantalla 1 ──────────────────────────────────────
  btnBack.addEventListener('click', () => {
    seleccionados.clear();
    screenProveedor.classList.add('hidden');
    screenUsuario.classList.remove('hidden');
  });

  // ── Comenzar conteo ──────────────────────────────────────────
  btnComenzar.addEventListener('click', () => {
    if (seleccionados.size === 0) return;

    localStorage.setItem('proveedores_seleccionados', JSON.stringify({
      sector:      sectorActual,
      usuario:     usuarioActual,
      proveedores: [...seleccionados].sort(),
    }));

    const destino = sectorActual === 'vinos' ? 'vinos.html' : 'spirits.html';
    window.location.href = destino;
  });

  // ── Click en tarjeta de usuario ──────────────────────────────
  document.querySelectorAll('.user-card').forEach(card => {
    function activar() {
      sectorActual  = card.dataset.sector;
      usuarioActual = card.dataset.usuario;
      seleccionados.clear();

      // Etiquetas del header
      const sectorLabel = sectorActual === 'vinos' ? 'Vinos' : 'Spirits & Gaseosas';
      provSectorLabel.textContent = sectorLabel;
      provUserLabel.textContent   = usuarioActual;

      // Render proveedores y cambio de pantalla
      renderProveedores(getProveedores(sectorActual));
      screenUsuario.classList.add('hidden');
      screenProveedor.classList.remove('hidden');
    }

    card.addEventListener('click', activar);
    card.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); activar(); }
    });
  });

})();
</script>
</body>
</html>
