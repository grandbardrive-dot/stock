<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>Grandbar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Barlow+Condensed:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap">
  <link rel="stylesheet" href="style.css">
  <style>
    .home-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: 2rem 1.5rem 3rem;
      gap: 2.5rem;
      background:
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(31,68,127,0.35) 0%, transparent 70%),
        var(--bg);
    }

    .home-logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
    }

    .home-logo img {
      width: 100%;
      max-width: 240px;
      height: auto;
      filter: drop-shadow(0 4px 20px rgba(203,168,106,0.3));
    }

    .home-titulo {
      font-family: var(--font);
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--gold);
      margin-top: 0.25rem;
    }

    .home-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      width: 100%;
      max-width: 380px;
    }

    .home-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.65rem;
      background: var(--surface);
      border: 2px solid var(--gold-dim);
      border-radius: 12px;
      padding: 2rem 1rem 1.75rem;
      text-decoration: none;
      color: var(--cream);
      cursor: pointer;
      transition: background 0.18s, border-color 0.18s, transform 0.12s;
      -webkit-tap-highlight-color: transparent;
    }

    .home-btn:hover  { background: var(--blue); border-color: var(--gold); }
    .home-btn:active { transform: scale(0.96); background: var(--blue-dark); }

    .home-btn-emoji {
      font-size: 2.6rem;
      line-height: 1;
    }

    .home-btn-label {
      font-family: var(--font);
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--cream);
    }

    .home-btn-sub {
      font-size: 0.65rem;
      color: var(--gold);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 600;
    }

    .home-admin {
      font-size: 0.65rem;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-decoration: none;
      opacity: 0.5;
    }
  </style>
</head>
<body>

<div class="home-wrap">

  <div class="home-logo">
    <img src="logo.png" alt="GrandBar">
    <span class="home-titulo">Grandbar Depósito</span>
  </div>

  <div class="home-grid">

    <a href="rutas.html" class="home-btn">
      <span class="home-btn-emoji">🚚</span>
      <span class="home-btn-label">Rutas</span>
      <span class="home-btn-sub">Próximamente</span>
    </a>

    <a href="stock.html" class="home-btn">
      <span class="home-btn-emoji">📦</span>
      <span class="home-btn-label">Stock</span>
      <span class="home-btn-sub">Control de inventario</span>
    </a>

  </div>

  <a href="admin.html" class="home-admin">⚙ Admin</a>

</div>

</body>
</html>
