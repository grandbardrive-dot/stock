<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>Grandbar — Control de Stock</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Barlow+Condensed:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="login-wrap">

  <div class="login-logo">
    <img src="logo.png" alt="GrandBar" width="220" height="auto">
    <span class="logo-tag">Control de Stock</span>
  </div>

  <span class="date-chip" id="date-label">—</span>

  <span class="divider-label">Seleccioná tu usuario</span>

  <div class="user-cards">

    <a href="vinos.html" class="user-card">
      <div class="avatar avatar-wine">LP</div>
      <div class="info">
        <div class="name">Lucas Porro</div>
        <div class="sector">Vinos</div>
      </div>
      <span class="arrow">›</span>
    </a>

    <a href="spirits.html" class="user-card">
      <div class="avatar avatar-spirit">LB</div>
      <div class="info">
        <div class="name">Lucas Buenanueva</div>
        <div class="sector">Spirits &amp; Gaseosas</div>
      </div>
      <span class="arrow">›</span>
    </a>

  </div>

</div>

<script src="app.js"></script>
<script>
  renderDate('date-label');
</script>
</body>
</html>
